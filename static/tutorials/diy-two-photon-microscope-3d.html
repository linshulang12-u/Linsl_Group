<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIY 双光子显微镜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: full-height split — 3D optical bench on the left, parts manual + design calculator on the right.
   Single dark look on purpose: two-photon rigs live in dark rooms behind light-tight curtains. */
:root{
  --bg:#0f141a;
  --panel:#141b23;
  --panel-2:#1a232d;
  --line:#27323e;
  --fg:#e6ebf1;
  --muted:#8f9cab;
  --accent:#f0b13c;      /* laser-safety amber */
  --nir:#ff4d5e;         /* excitation, false colour */
  --em-g:#43d495;
  --em-r:#ff9152;
  --shg:#7f97ff;
  --wf:#efd9a6;
  --ok:#5fd39a; --warn:#f0b13c; --bad:#ff6b6b;
  --f-display:"Barlow Condensed","Noto Sans SC",system-ui,sans-serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.6;overflow:hidden}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}

/* ---------- viewer ---------- */
.viewer{position:relative;min-width:0;overflow:hidden;background:radial-gradient(120% 90% at 35% 30%,#18212b 0%,var(--bg) 70%)}
#gl{position:absolute;inset:0}
#gl canvas{display:block;outline:none}
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:3}
.brand{pointer-events:auto}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.02em;line-height:1.05;text-wrap:balance}
.brand p{margin:4px 0 0;color:var(--muted);font-size:12.5px}
.brand p b{color:var(--accent);font-weight:500}
.tools{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto;justify-content:flex-end}
.chip{font:500 12.5px/1 var(--f-body);color:var(--muted);background:rgba(20,27,35,.82);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;backdrop-filter:blur(6px)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid var(--muted)}
.chip[aria-pressed="true"]{color:var(--fg);border-color:#4a5a6b}
.chip[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.chip.plain::before{display:none}
.chip:hover{color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(20,27,35,.82)}
.seg button{font:500 12.5px/1 var(--f-body);color:var(--muted);background:none;border:0;padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#1a1205}
button:focus-visible,input:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{position:absolute;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);z-index:3;max-width:calc(100% - 32px);pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.hint{position:absolute;right:16px;bottom:14px;font-size:11.5px;color:#6b7988;z-index:3;pointer-events:none}
#tip{position:absolute;z-index:4;pointer-events:none;background:#0b1015;border:1px solid #3a4756;border-radius:5px;padding:4px 8px;font-size:12.5px;white-space:nowrap;transform:translate(12px,12px)}
#tip b{font-family:var(--f-mono);color:var(--accent);font-weight:500;margin-right:6px}
.pin{pointer-events:auto;cursor:pointer;font:500 10.5px/1 var(--f-mono);color:#0f141a;background:#c9d3de;border-radius:9px;min-width:18px;height:18px;padding:0 4px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(15,20,26,.75);transition:transform .15s}
.pin:hover{transform:scale(1.15)}
.pin.on{background:var(--accent)}

/* ---------- side panel ---------- */
.side{min-width:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;height:100%;overflow:hidden}
.detail{flex:0 0 auto;max-height:54%;overflow:auto;padding:18px 20px 16px;border-bottom:1px solid var(--line);background:var(--panel-2)}
.d-head{display:flex;gap:12px;align-items:flex-start}
.d-num{font:500 13px/1 var(--f-mono);background:var(--accent);color:#1a1205;border-radius:4px;padding:6px 7px;flex:none;margin-top:3px}
.d-head h2{margin:0;font-size:19px;font-weight:700;line-height:1.3;text-wrap:balance}
.d-en{margin:2px 0 0;color:var(--muted);font-family:var(--f-display);font-size:15px;letter-spacing:.03em}
.d-grp{display:inline-block;margin:10px 0 2px;font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.detail h3{margin:12px 0 4px;font-size:11.5px;font-weight:500;letter-spacing:.14em;color:var(--accent)}
.detail p{margin:0;color:#cfd7e0}
.detail ul{margin:0;padding-left:18px;color:#cfd7e0}
.detail li{margin:2px 0}
code{font-family:var(--f-mono);font-size:12px;color:#ffd58a;background:rgba(240,177,60,.08);border-radius:3px;padding:0 4px}
.scroll{flex:1 1 auto;overflow:auto;min-height:0}
.sec{padding:16px 20px 6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 6px}
.sec-h h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.04em}
.sec-h span{font:400 11.5px var(--f-mono);color:var(--muted)}
.grp{margin:12px 0 4px;font-size:11px;letter-spacing:.14em;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:1px}
.item{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:baseline;text-align:left;background:none;border:0;border-radius:5px;padding:5px 6px;color:var(--fg);cursor:pointer;font:inherit}
.item:hover{background:#1c2630}
.item.on{background:rgba(240,177,60,.12)}
.item .n{font:500 11.5px var(--f-mono);color:var(--muted)}
.item.on .n{color:var(--accent)}
.item .t{min-width:0}
.item .t small{color:var(--muted);font-family:var(--f-display);font-size:13px;letter-spacing:.03em;margin-left:6px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;margin-top:8px}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.calc input{width:100%;font:500 13px var(--f-mono);color:var(--fg);background:#0f151c;border:1px solid var(--line);border-radius:5px;padding:6px 8px;font-variant-numeric:tabular-nums}
.out{margin:12px 0 4px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #1f2933;font-size:13px}
.row span:first-child{color:var(--muted)}
.row span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.pill{display:inline-block;font:500 11px var(--f-body);border-radius:10px;padding:2px 8px;margin-left:6px}
.pill.ok{background:rgba(95,211,154,.15);color:var(--ok)}
.pill.warn{background:rgba(240,177,60,.15);color:var(--warn)}
.pill.bad{background:rgba(255,107,107,.15);color:var(--bad)}
.note{font-size:11.5px;color:#73808e;margin:8px 0 18px}

@media (max-width:880px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto}
  .viewer{height:60vh;min-height:360px;flex:none}
  .side{height:auto;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .detail{max-height:none}
  .scroll{overflow:visible}
  .hint{display:none}
  .brand h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){ .pin{transition:none} }
</style>

<div class="app">
  <section class="viewer" id="viewer" aria-label="三维模型">
    <div id="gl"></div>
    <div class="top">
      <div class="brand">
        <h1>DIY 双光子扫描显微镜</h1>
        <p>正置 · 共振-振镜扫描 · 非退扫探测 · <b>32 个部件</b></p>
      </div>
      <div class="tools">
        <div class="seg" role="group" aria-label="成像模式">
          <button id="m2p" aria-pressed="true">双光子</button>
          <button id="mwf" aria-pressed="false">宽场</button>
        </div>
        <button class="chip" id="tBeam" aria-pressed="true">光路</button>
        <button class="chip" id="tScan" aria-pressed="true">扫描动画</button>
        <button class="chip" id="tPin" aria-pressed="true">编号</button>
        <button class="chip" id="tShell" aria-pressed="true">壳体</button>
        <button class="chip" id="tEncl" aria-pressed="false">遮光罩</button>
        <button class="chip plain" id="tReset">复位视角</button>
      </div>
    </div>
    <div class="legend">
      <span><i style="background:var(--nir)"></i>激发 920 nm（伪彩）</span>
      <span><i style="background:var(--em-g)"></i>绿通道荧光</span>
      <span><i style="background:var(--em-r)"></i>红通道荧光</span>
      <span><i style="background:var(--shg)"></i>前向 SHG</span>
      <span><i style="background:var(--wf)"></i>宽场照明</span>
    </div>
    <div class="hint">拖动旋转 · 右键平移 · 滚轮缩放 · 点击部件</div>
    <div id="tip" hidden></div>
  </section>

  <aside class="side" id="side">
    <div class="detail" id="detail" aria-live="polite"></div>
    <div class="scroll">
      <div class="sec">
        <div class="sec-h"><h3>部件清单</h3><span>按光路顺序</span></div>
        <div id="list"></div>
      </div>
      <div class="sec">
        <div class="sec-h"><h3>光学设计核算</h3><span>4f 扫描中继</span></div>
        <div class="calc">
          <label for="cD">扫描镜处光束直径 D (mm)<input id="cD" type="number" step="0.1" value="5"></label>
          <label for="cTh">扫描光学角 峰-峰 (°)<input id="cTh" type="number" step="0.5" value="26"></label>
          <label for="cFs">扫描透镜 f<sub>s</sub> (mm)<input id="cFs" type="number" step="1" value="50"></label>
          <label for="cFt">管镜 f<sub>t</sub> (mm)<input id="cFt" type="number" step="1" value="200"></label>
          <label for="cM">物镜倍率 M<input id="cM" type="number" step="1" value="16"></label>
          <label for="cL">厂家管镜焦距 (mm)<input id="cL" type="number" step="1" value="200"></label>
          <label for="cNA">物镜 NA<input id="cNA" type="number" step="0.01" value="0.8"></label>
          <label for="cN">浸没折射率 n<input id="cN" type="number" step="0.01" value="1.33"></label>
          <label for="cLam">激发波长 λ (nm)<input id="cLam" type="number" step="10" value="920"></label>
        </div>
        <div class="out" id="out"></div>
        <p class="note">厂家管镜焦距：Nikon / Leica 200，Olympus 180，Zeiss 165。分辨率按 Zipfel 等（2003）双光子照明 PSF 公式，有效 NA 取 NA × min(1, 填充比) 作粗略估计；实际值受像差和散射影响会更大。</p>
      </div>
    </div>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
(function(){
const GROUPS={A:'激发光路与功率控制',B:'扫描头',C:'物镜、样品与调焦',D:'非退扫与前向探测',E:'控制、平台与防护'};
const PARTS=[
{id:'laser',g:'A',zh:'飞秒激光器',en:'Femtosecond laser',
 role:'输出高峰值功率的近红外飞秒脉冲。双光子吸收只在焦点处足够强，这就是层析能力的来源。',
 spec:['可调谐 Ti:Sapphire：680–1080 nm，~100–140 fs，80 MHz，920 nm 处 >1.5 W','或固定波长光纤激光：920 nm（GCaMP / GFP）、1040 nm（tdTomato / RFP），成本明显更低','TEM00，线偏振（多为水平），光束直径 ~1–2 mm'],
 tip:'Class 4 激光，搭建全程佩戴对应波段护目镜，光路保持水平且低于眼睛高度。激光出口高度决定整条台面光路的中心高（本模型取 100 mm）。从激光到焦点的总 GDD（Pockels、物镜、透镜）可达 10⁴ fs² 量级，带色散预补偿的型号可以省掉棱镜对。'},
{id:'hwp',g:'A',zh:'λ/2 波片（电动旋转）',en:'Half-wave plate, motorized',
 role:'旋转入射偏振，与 Pockels 盒及后面的 PBS 一起设定透过率上限，相当于一个慢速的总功率旋钮。',
 spec:['零级或消色差 λ/2，690–1200 nm 增透','电动旋转座（如 Thorlabs <code>K10CR1</code>），便于软件记录功率'],
 tip:'先用它把最大输出限定在实验允许的安全值，再让 Pockels 做快速调制，样品和 PMT 都受保护。'},
{id:'pockels',g:'A',zh:'电光调制器 Pockels 盒',en:'Pockels cell (EOM)',
 role:'μs 级强度调制：行回扫消隐；共振镜在视场边缘速度慢、驻留时间长，需在边缘降功率或直接消隐；随成像深度增加功率。',
 spec:['KD*P 晶体，孔径 ≥ 2.7 mm，如 Conoptics <code>350-80</code> + <code>302RM</code> 高压驱动','消光比 >100:1，带宽 >1 MHz','需要 DAQ 一路模拟输出与扫描同步'],
 tip:'晶体本身贡献数百至上千 fs² 的 GDD。用功率计配合慢扫电压，标定透过率–电压曲线（sin² 形），在软件里查表线性化。'},
{id:'pbs',g:'A',zh:'偏振分束立方 + 光阱',en:'PBS analyzer + beam dump',
 role:'Pockels 盒的检偏器：透射偏振继续前进，被拒绝的分量反射进光阱。',
 spec:['宽带 PBS（700–1300 nm）或 Glan-laser 棱镜（消光比更高）','光阱需承受全功率 >2 W，带散热片'],
 tip:'光阱必须固定牢靠，开口朝平台内侧，不让任何反射光离开台面。'},
{id:'shutter',g:'A',zh:'机械快门',en:'Mechanical shutter',
 role:'不采集时彻底挡光，避免漂白，也防止 PMT 在开盖、换样时受强光。',
 spec:['Thorlabs <code>SH05</code> 或 Uniblitz，孔径 ≥ 5 mm','由采集软件的 TTL 控制'],
 tip:'Pockels 关态仍有残余功率，不能代替快门做安全挡光。'},
{id:'expander',g:'A',zh:'扩束望远镜',en:'Beam expander',
 role:'把激光直径扩到与扫描镜通光口径匹配，经后面的 4f 中继放大后正好填满物镜后孔径。',
 spec:['伽利略式：f = −50 mm + f = +150 mm，3×，无实焦点（避免空气电离）','NIR 增透（650–1050 nm）'],
 tip:'微调两片间距可改变出射发散，等效于小范围移动焦面。搭建时用剪切干涉板确认准直。'},
{id:'steer',g:'A',zh:'导向反射镜 M1 / M2',en:'Steering mirrors',
 role:'两面镜子提供 4 个自由度，把光轴同时对准潜望镜和扫描镜中心。',
 spec:['1" 宽带介质镜（750–1100 nm），优先低 GDD 超快镜','精密运动学镜架'],
 tip:'在下游放两个光阑：近光阑调 M1，远光阑调 M2，反复迭代到光束同时穿过两孔。'},
{id:'periscope',g:'A',zh:'潜望镜',en:'Periscope',
 role:'把光束从台面高度抬到扫描头高度，并转向进入扫描镜。',
 spec:['两面 1" 介质镜 + 刚性立柱（如 Thorlabs <code>RS99</code> 套件或 1.5" 立柱）'],
 tip:'光束在水平面内转了 90°，偏振随之由水平变为竖直。做偏振敏感的 SHG，或在意介质镜 s/p 反射率差异时要考虑这一点，必要时在潜望镜后再加一片 λ/2。'},
{id:'scanner',g:'B',zh:'共振-振镜扫描器',en:'Galvo-resonant scanner',
 role:'8 kHz 共振镜负责快轴（X），振镜负责慢轴（Y）。扫描镜位于物镜后焦面的共轭面，镜子的转角变成焦点在样品中的横向位移。',
 spec:['Cambridge Technology <code>CRS 8 kHz</code>，镜面约 5 mm 量级，最大光学角以说明书为准（约 26° 峰-峰）','慢轴振镜如 <code>6215H</code>，5 mm 镜片','512 × 512 双向扫描约 30 fps；需要随机寻址或光刺激时可用双振镜'],
 tip:'两镜紧耦合时只能把两镜中点放在扫描透镜前焦面，大视场边缘有少量渐晕；更严格的做法是两镜之间加 4f 或球面镜中继。双向扫描要在软件里标定共振相位，消除奇偶行错位。'},
{id:'scanlens',g:'B',zh:'扫描透镜',en:'Scan lens',
 role:'把扫描角转换为中间像面上的位置，并与管镜组成 4f 中继。',
 spec:['Thorlabs <code>SL50-2P2</code>：f = 50 mm，双光子波段优化，平场'],
 tip:'扫描镜到扫描透镜的距离按其入瞳位置放置（说明书给出），不是按机械端面。'},
{id:'tubelens',g:'B',zh:'管镜',en:'Tube lens',
 role:'与扫描透镜一起把扫描镜成像到物镜后焦面，同时把光束放大 f<sub>t</sub>/f<sub>s</sub> 倍。',
 spec:['Thorlabs <code>TTL200MP</code>：f = 200 mm，多光子优化','本模型放大 4×：5 mm → 20 mm'],
 tip:'管镜到物镜后焦面的距离应约等于 f<sub>t</sub>。BFP 通常在物镜肩部以内几毫米，偏离会造成视场边缘功率下降和渐晕。'},
{id:'fold',g:'B',zh:'可切换折返镜',en:'Switchable fold mirror',
 role:'双光子模式下把水平光束折向下方物镜；宽场模式时移出光路，让样品像上行到相机。',
 spec:['2" 宽带介质镜，装在电动翻转座（如 <code>MFF102</code>）或线性滑块上'],
 tip:'切换的角度重复性直接影响光轴，镜座要带机械限位。点右上角“宽场”可以看到它移出。'},
{id:'camera',g:'B',zh:'宽场相机与镜筒',en:'Widefield camera',
 role:'找样品、看血管图谱、定位视野，不参与双光子成像。',
 spec:['USB3 CMOS 相机 + f = 200 mm 镜筒'],
 tip:'主二色镜反射 <705 nm 的光，所以透射明场宜用 >720 nm 的近红外 LED，或把主二色镜做成可滑出的。相机焦面要与双光子焦面做齐焦标定。'},
{id:'housing',g:'B',zh:'扫描头与探测笼式结构',en:'Scan head & detector cage',
 role:'刚性固定扫描光学与探测光学，并遮挡杂散光。',

const std=(c,m=.3,r=.55,x={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:m,roughness:r},x));
const M={
  black:()=>std(0x20262d,.35,.5), dark:()=>std(0x2c3540,.4,.45), alu:()=>std(0xb3bcc6,.6,.32),
  steel:()=>std(0x9ea8b2,.7,.28), white:()=>std(0xd5dae0,.15,.45), mirror:()=>std(0xe3ebf4,.55,.14),
  glass:()=>std(0xa6d6ff,.05,.05,{transparent:true,opacity:.38,depthWrite:false}),

function add(g,geo,mat,p){const m=new THREE.Mesh(geo,mat);if(p)m.position.copy(p);g.add(m);return m;}
function box(g,w,h,d,p,mat){return add(g,new THREE.BoxGeometry(w,h,d),mat,p);}
function cyl(g,r,len,p,dir,mat,rTop,seg=28,open=false){const m=add(g,new THREE.CylinderGeometry(rTop==null?r:rTop,r,len,seg,1,open),mat,p);m.quaternion.setFromUnitVectors(Y,dir.clone().normalize());return m;}
function ring(g,R,t,p,dir,mat){const m=add(g,new THREE.TorusGeometry(R,t,10,36),mat,p);m.quaternion.setFromUnitVectors(Z,dir.clone().normalize());return m;}
function post(g,x,z,yTop,y0=0){const h=yTop-y0;cyl(g,.62,h,V(x,y0+h/2,z),Y,M.steel());const hh=Math.min(6,h*.55);cyl(g,.9,hh,V(x,y0+hh/2,z),Y,M.black());box(g,3,.5,3,V(x,y0+.25,z),M.black());}
function mirror(g,p,inD,outD,o={}){
  const n=outD.clone().sub(inD).normalize(),r=o.r||1.3;
  cyl(g,r,.45,p,n,o.mat||M.mirror(),null,32);
  const pl=box(g,r*2.5,r*2.5,.9,p.clone().addScaledVector(n,-.75),M.black());pl.quaternion.setFromUnitVectors(Z,n);
  if(o.post!==false)post(g,p.x-n.x*1.1,p.z-n.z*1.1,p.y-r*1.25,o.y0||0);
  return n;
}
function lens(g,p,dir,r,o={}){
  const t=o.t||Math.max(.3,r*.28);
  const s=add(g,new THREE.SphereGeometry(1,32,16),M.glass(),p);s.scale.set(r,t,r);s.quaternion.setFromUnitVectors(Y,dir);
  ring(g,r+.25,.32,p,dir,M.black());
  if(o.post!==false)post(g,p.x,p.z,p.y-r-.5,o.y0||0);
}
function barrel(g,p,dir,r,len){cyl(g,r,len,p,dir,M.black());const d=dir.clone().normalize();[-1,1].forEach(s=>cyl(g,r*.82,.06,p.clone().addScaledVector(d,s*len/2+s*.03),d,M.glass()));ring(g,r+.05,.12,p.clone().addScaledVector(d,len*.3),d,M.alu());}
function frame(g,x0,x1,z0,z1,hx0,hx1,hz0,hz1,y0,y1,mat){const h=y1-y0,yc=(y0+y1)/2;
  box(g,x1-x0,h,hz0-z0,V((x0+x1)/2,yc,(z0+hz0)/2),mat);box(g,x1-x0,h,z1-hz1,V((x0+x1)/2,yc,(hz1+z1)/2),mat);
  box(g,hx0-x0,h,hz1-hz0,V((x0+hx0)/2,yc,(hz0+hz1)/2),mat);box(g,x1-hx1,h,hz1-hz0,V((hx1+x1)/2,yc,(hz0+hz1)/2),mat);}
function shell(g,c,s,o=.14,edge=0x5a6d82){const m=box(g,s.x,s.y,s.z,c,M.shell(o));const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:edge,transparent:true,opacity:.75}));e.position.copy(c);g.add(e);return m;}
function led(g,p,c){add(g,new THREE.SphereGeometry(.22,10,8),new THREE.MeshBasicMaterial({color:c}),p);}

function holeTex(){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');x.fillStyle='#3a424c';x.fillRect(0,0,64,64);x.fillStyle='#1b2026';x.beginPath();x.arc(32,32,7,0,7);x.fill();const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(60,36);t.anisotropy=8;return t;}
function scanTex(){const c=document.createElement('canvas');c.width=512;c.height=300;const x=c.getContext('2d');
  x.fillStyle='#0c1014';x.fillRect(0,0,512,300);x.fillStyle='#000';x.fillRect(14,14,272,272);
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  for(let i=0;i<5000;i++){x.fillStyle=`rgba(60,200,120,${rnd()*.25})`;x.fillRect(14+rnd()*272,14+rnd()*272,1,1);}
  x.strokeStyle='rgba(70,190,120,.35)';x.lineWidth=2;for(let i=0;i<9;i++){x.beginPath();let px=14+rnd()*272,py=14+rnd()*272;x.moveTo(px,py);for(let k=0;k<6;k++){px+=(rnd()-.5)*70;py+=(rnd()-.5)*70;x.lineTo(px,py);}x.stroke();}
  for(let i=0;i<46;i++){const px=26+rnd()*248,py=26+rnd()*248,r=4+rnd()*5;const gr=x.createRadialGradient(px,py,0,px,py,r*1.6);const a=.4+rnd()*.6;gr.addColorStop(0,`rgba(150,255,180,${a})`);gr.addColorStop(.5,`rgba(60,220,120,${a*.6})`);gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.beginPath();x.arc(px,py,r*1.6,0,7);x.fill();}
  x.fillStyle='#1d252e';[[300,14,198,60],[300,84,198,90],[300,184,198,102]].forEach(r=>x.fillRect(...r));
  x.fillStyle='#f0b13c';x.fillRect(312,30,70,8);x.fillStyle='#43d495';x.fillRect(312,100,160,6);x.fillStyle='#ff9152';x.fillRect(312,116,110,6);
  x.strokeStyle='#43d495';x.lineWidth=1.5;x.beginPath();for(let i=0;i<180;i++){const yy=250-Math.abs(Math.sin(i*.09))*30*rnd()-10*Math.exp(-((i-90)**2)/90);i?x.lineTo(310+i,yy):x.moveTo(310,yy);}x.stroke();
  return new THREE.CanvasTexture(c);}

  const k=1-10/dTL;Cc.set(45+ox*k,Yfold+oy*k,15);
  FOC.set(45-ox*.55,Ysample+.02,15-oy*.55);
  dyn.sa.set(SC,A);dyn.ab.set(A,B);dyn.bc.set(B,Cc);dyn.cd.set(Cc,BFP);dyn.foc.set(FOC,BFP);
  if(state.scan&&state.mode==='2p'){
    if(phase<lastPhase)trailN=0;lastPhase=phase;
    if(trailN<NT){trailPos.set([FOC.x,Ysample+.04,FOC.z],trailN*3);trailN++;trailGeo.setDrawRange(0,trailN);trailGeo.attributes.position.needsUpdate=true;}
  }else{trailN=0;trailGeo.setDrawRange(0,0);}
}
function loop(now){
  requestAnimationFrame(loop);
  const t=(now-t0)/1000;
  updateScan(t);
  const target=state.mode==='wf'?-3.8:0;foldX+=(target-foldX)*(reduce?1:.08);foldMove.position.x=foldX;
  if(tween){const u=Math.min(1,(now-tween.t0)/tween.d),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;controls.target.lerpVectors(tween.ft,tween.tt,e);camera.position.lerpVectors(tween.fp,tween.tp,e);if(u>=1)tween=null;}
  if(selected==='fold')selBox.setFromObject(parts.fold);
  controls.update();renderer.render(scene,camera);labels.render(scene,camera);
}
select('scanner',false);
requestAnimationFrame(loop);

/* ---------------- calculator ---------------- */
const ids=['cD','cFs','cFt','cM','cL','cNA','cTh','cLam','cN'],out=document.getElementById('out');
function calc(){
  const v={};ids.forEach(i=>v[i]=parseFloat(document.getElementById(i).value));
  if(ids.some(i=>!(v[i]>0))){out.innerHTML='<div class="row"><span>请输入正数</span><span>—</span></div>';return;}
  const Db=v.cD*v.cFt/v.cFs,fo=v.cL/v.cM,P=2*v.cNA*fo,fill=Db/P,T=1-Math.exp(-2*(P/Db)**2);
  const thB=v.cTh*v.cFs/v.cFt*Math.PI/180,fov=2*fo*Math.tan(thB/2);
  const NAe=v.cNA*Math.min(1,fill),lam=v.cLam/1000,k=Math.sqrt(2*Math.LN2);
  let res='—',resz='—';
  if(NAe<v.cN){const wxy=NAe>.7?.325*lam/(Math.SQRT2*Math.pow(NAe,.91)):.32*lam/(Math.SQRT2*NAe);const wz=.532*lam/Math.SQRT2/(v.cN-Math.sqrt(v.cN*v.cN-NAe*NAe));res=(wxy*k).toFixed(2)+' µm';resz=(wz*k).toFixed(2)+' µm';}
  const pill=fill<.8?'<span class="pill warn">欠填充</span>':fill<=1.25?'<span class="pill ok">匹配</span>':'<span class="pill bad">过填充</span>';
  const rows=[['物镜焦距 f<sub>obj</sub>',fo.toFixed(2)+' mm'],['物镜后孔径 2·NA·f',P.toFixed(1)+' mm'],['到达 BFP 的光束直径',Db.toFixed(1)+' mm'],
    ['填充比',fill.toFixed(2)+pill],['后孔径功率透过（高斯）',(T*100).toFixed(0)+' %'],['样品面视场',(fov*1000).toFixed(0)+' µm'],
    ['横向 FWHM（估计）',res],['轴向 FWHM（估计）',resz]];
  out.innerHTML=rows.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('');
}
ids.forEach(i=>document.getElementById(i).addEventListener('input',calc));calc();
})();
</script>
